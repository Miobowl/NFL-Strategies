<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#2d5a2d"/>

  <!-- Field lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="Arial">
    Wildcat Formation
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Arial" opacity="0.8">
    野猫阵型 - RB接直接传球
  </text>
  <!-- Line of Scrimmage -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="50" y="355" fill="#ffeb3b" font-size="14" font-weight="bold">LOS</text>
  <!-- Offensive Line -->
  <circle cx="250" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="250" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LT</text>
  <circle cx="320" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LG</text>
  <circle cx="400" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C</text>
  <circle cx="480" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="480" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RG</text>
  <circle cx="550" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="550" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RT</text>
  <circle cx="400" cy="390" r="24" fill="#ff6b35" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="398" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">RB</text>
  <circle cx="300" cy="360" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="366" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">QB</text>
  <circle cx="450" cy="390" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="397" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RB</text>
  <circle cx="150" cy="350" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="356" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WR</text>
  <circle cx="680" cy="350" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="680" y="356" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WR</text>
  <text x="400" y="440" text-anchor="middle" fill="#ffffff" font-size="12">RB接直接传球</text>
  <text x="400" y="460" text-anchor="middle" fill="#ffeb3b" font-size="11">跑球威胁最大</text>
  <!-- Legend -->
  <g transform="translate(50, 540)">
    <circle cx="0" cy="0" r="14" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="5" fill="#ffffff" font-size="12">= 进攻</text>

    <circle cx="100" cy="0" r="14" fill="#ff6b35" stroke="#ffffff" stroke-width="2"/>
    <text x="120" y="5" fill="#ffffff" font-size="12">= 四分卫</text>
  </g>
</svg>