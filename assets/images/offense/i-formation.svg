<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#2d5a2d"/>

  <!-- Field lines -->
  <line x1="0" y1="250" x2="800" y2="250" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="Arial">
    I-Formation
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Arial" opacity="0.8">
    I阵型 - 经典跑球阵型
  </text>

  <!-- Line of Scrimmage -->
  <line x1="100" y1="250" x2="700" y2="250" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="50" y="255" fill="#ffeb3b" font-size="14" font-weight="bold">LOS</text>

  <!-- Offensive Line (5 players) -->
  <circle cx="250" cy="250" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="250" y="257" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LT</text>

  <circle cx="320" cy="250" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="257" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LG</text>

  <circle cx="400" cy="250" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="257" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C</text>

  <circle cx="480" cy="250" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="480" y="257" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RG</text>

  <circle cx="550" cy="250" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="550" y="257" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RT</text>

  <!-- Tight End -->
  <circle cx="600" cy="250" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="600" y="256" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">TE</text>

  <!-- Quarterback (under center) -->
  <circle cx="400" cy="285" r="22" fill="#ff6b35" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="293" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">QB</text>

  <!-- Fullback (I formation - first in line) -->
  <circle cx="400" cy="335" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="342" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">FB</text>

  <!-- Running Back (I formation - second in line) -->
  <circle cx="400" cy="385" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="392" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">RB</text>

  <!-- I-Formation alignment line -->
  <line x1="400" y1="270" x2="400" y2="405" stroke="#ffeb3b" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="430" y="335" fill="#ffeb3b" font-size="14" font-weight="bold">"I" 型排列</text>

  <!-- Wide Receivers -->
  <circle cx="150" cy="250" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="256" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">WR</text>

  <circle cx="200" cy="250" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="256" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">WR</text>

  <!-- Defense indicator -->
  <text x="400" y="180" text-anchor="middle" fill="#ff4444" font-size="14" opacity="0.6">← Defense</text>

  <!-- Running direction arrow -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00ff00"/>
    </marker>
  </defs>
  <line x1="400" y1="405" x2="400" y2="140" stroke="#00ff00" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="420" y="270" fill="#00ff00" font-size="13" font-weight="bold">跑球方向</text>

  <!-- Legend -->
  <g transform="translate(50, 420)">
    <circle cx="0" cy="0" r="15" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
    <text x="25" y="5" fill="#ffffff" font-size="14">= 进攻球员</text>

    <circle cx="150" cy="0" r="15" fill="#ff6b35" stroke="#ffffff" stroke-width="3"/>
    <text x="175" y="5" fill="#ffffff" font-size="14">= 四分卫</text>
  </g>

  <!-- Key Features -->
  <g transform="translate(550, 360)">
    <text x="0" y="0" fill="#ffffff" font-size="12" font-weight="bold">关键特点:</text>
    <text x="0" y="20" fill="#ffffff" font-size="11">• QB紧贴中锋</text>
    <text x="0" y="38" fill="#ffffff" font-size="11">• FB为RB开路</text>
    <text x="0" y="56" fill="#ffffff" font-size="11">• 强力跑球阵型</text>
    <text x="0" y="74" fill="#ffffff" font-size="11">• 短码数优势</text>
  </g>
</svg>
