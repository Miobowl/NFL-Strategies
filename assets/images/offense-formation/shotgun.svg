<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#2d5a2d"/>

  <!-- Field lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="Arial">
    Shotgun Formation
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Arial" opacity="0.8">
    霰弹枪阵型 - QB后方5-7码接球
  </text>

  <!-- Line of Scrimmage -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="50" y="355" fill="#ffeb3b" font-size="14" font-weight="bold">LOS</text>

  <!-- Offensive Line -->
  <circle cx="250" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="250" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LT</text>

  <circle cx="320" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LG</text>

  <circle cx="400" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C</text>

  <circle cx="480" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="480" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RG</text>

  <circle cx="550" cy="350" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="550" y="357" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RT</text>

  <!-- Quarterback (deep shotgun position) -->
  <circle cx="400" cy="430" r="24" fill="#ff6b35" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="438" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">QB</text>

  <!-- Distance indicator -->
  <line x1="390" y1="355" x2="390" y2="425" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="350" y="390" fill="#00ffff" font-size="12" font-weight="bold">5-7码</text>

  <!-- Running Back -->
  <circle cx="450" cy="430" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="437" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RB</text>

  <!-- Wide Receivers -->
  <circle cx="120" cy="350" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="120" y="356" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WR</text>

  <circle cx="680" cy="350" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="680" y="356" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WR</text>

  <!-- Tight End or Slot -->
  <circle cx="620" cy="360" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="620" y="366" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">TE</text>

  <!-- Vision lines showing QB advantage -->
  <path d="M 400,415 L 200,300" stroke="#ffeb3b" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  <path d="M 400,415 L 600,300" stroke="#ffeb3b" stroke-width="1.5" opacity="0.4" stroke-dasharray="3,3"/>
  <text x="400" y="490" text-anchor="middle" fill="#ffeb3b" font-size="12">视野开阔 - 更好的读防能力</text>

  <!-- Key Features Box -->
  <g transform="translate(540, 120)">
    <rect x="-10" y="-10" width="240" height="160" fill="#000000" opacity="0.85" rx="8"/>
    <text x="0" y="10" fill="#ffffff" font-size="13" font-weight="bold">Shotgun 要点:</text>
    <text x="0" y="30" fill="#ffffff" font-size="10">✓ QB站在中锋后5-7码</text>
    <text x="0" y="46" fill="#ffffff" font-size="10">✓ 直接处于传球姿势</text>
    <text x="0" y="62" fill="#ffffff" font-size="10">✓ 更好的视野和时间</text>
    <text x="0" y="78" fill="#ffffff" font-size="10">✓ 适合快速传球</text>
    <text x="0" y="94" fill="#ffffff" font-size="10">✓ 现代NFL主流阵型</text>
    <text x="0" y="110" fill="#ffffff" font-size="10">⚠ 跑球威胁相对较小</text>
    <text x="0" y="126" fill="#ffffff" font-size="10">⚠ RB助跑距离短</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 540)">
    <circle cx="0" cy="0" r="14" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="5" fill="#ffffff" font-size="12">= 进攻</text>

    <circle cx="100" cy="0" r="14" fill="#ff6b35" stroke="#ffffff" stroke-width="2"/>
    <text x="120" y="5" fill="#ffffff" font-size="12">= 四分卫</text>
  </g>
</svg>