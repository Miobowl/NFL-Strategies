<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#2d5a2d"/>

  <!-- Field lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="Arial">
    T Formation
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Arial" opacity="0.8">
    T字阵型 - 经典跑球阵型
  </text>
  <!-- Line of Scrimmage -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="50" y="405" fill="#ffeb3b" font-size="14" font-weight="bold">LOS</text>
  <!-- Offensive Line -->
  <circle cx="250" cy="400" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="250" y="407" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LT</text>
  <circle cx="320" cy="400" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="320" y="407" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">LG</text>
  <circle cx="400" cy="400" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="407" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C</text>
  <circle cx="480" cy="400" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="480" y="407" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RG</text>
  <circle cx="550" cy="400" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="550" y="407" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RT</text>
  <!-- Quarterback -->
  <circle cx="400" cy="440" r="22" fill="#ff6b35" stroke="#ffffff" stroke-width="3"/>
  <text x="400" y="448" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">QB</text>
  <circle cx="350" cy="480" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="350" y="487" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">HB</text>
  <circle cx="400" cy="510" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="517" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">FB</text>
  <circle cx="450" cy="480" r="20" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="487" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">HB</text>
  <path d="M 330,490 L 470,490" stroke="#00ffff" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="400" y1="455" x2="400" y2="495" stroke="#00ffff" stroke-width="3" stroke-dasharray="5,5" opacity="0.6"/>
  <text x="500" y="490" fill="#00ffff" font-size="14" font-weight="bold">T字形</text>
  <circle cx="150" cy="400" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="406" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WR</text>
  <circle cx="650" cy="400" r="18" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="650" y="406" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">WR</text>
  <!-- Legend -->
  <g transform="translate(50, 540)">
    <circle cx="0" cy="0" r="14" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
    <text x="20" y="5" fill="#ffffff" font-size="12">= 进攻</text>

    <circle cx="100" cy="0" r="14" fill="#ff6b35" stroke="#ffffff" stroke-width="2"/>
    <text x="120" y="5" fill="#ffffff" font-size="12">= 四分卫</text>

    <circle cx="230" cy="0" r="14" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
    <text x="250" y="5" fill="#ffffff" font-size="12">= 防守</text>
  </g>
</svg>