<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#2d5a2d"/>

  <!-- Field lines -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="bold" font-family="Arial">
    Cover 6
  </text>
  <text x="400" y="70" text-anchor="middle" fill="#ffffff" font-size="18" font-family="Arial" opacity="0.8">
    Cover 6 - 半场人盯人半场区域
  </text>

  <!-- Line of Scrimmage -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="50" y="355" fill="#ffeb3b" font-size="14" font-weight="bold">LOS</text>
  <circle cx="150" cy="350" r="12" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="354" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">WR</text>
  <circle cx="650" cy="350" r="12" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="650" y="354" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">WR</text>
  <circle cx="400" cy="360" r="12" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="364" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">WR</text>
  <circle cx="200" cy="160" r="15" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">SS</text>
  <rect x="120" y="100" width="180" height="150" fill="#ff4444" opacity="0.2" stroke="#ff4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="210" y="180" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C2</text>
  <circle cx="150" cy="300" r="14" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="150" y="305" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">CB</text>
  <circle cx="500" cy="160" r="15" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">FS</text>
  <circle cx="600" cy="160" r="15" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="600" y="165" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">CB</text>
  <rect x="450" y="100" width="120" height="150" fill="#00ffff" opacity="0.2" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="510" y="180" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C4</text>
  <rect x="590" y="100" width="90" height="150" fill="#00ffff" opacity="0.2" stroke="#00ffff" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="635" y="180" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">C4</text>
  <circle cx="300" cy="300" r="14" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="300" y="305" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">OLB</text>
  <circle cx="400" cy="300" r="14" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">MLB</text>
  <circle cx="550" cy="300" r="14" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
  <text x="550" y="305" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="bold">OLB</text>
  <line x1="400" y1="100" x2="400" y2="380" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="250" y="130" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Cover 2</text>
  <text x="550" y="130" text-anchor="middle" fill="#00ffff" font-size="12" font-weight="bold">Cover 4</text>
  <text x="400" y="480" text-anchor="middle" fill="#ffeb3b" font-size="13" font-weight="bold">左C2 + 右C4混合防守</text>
  <!-- Legend -->
  <g transform="translate(50, 540)">
    <circle cx="0" cy="0" r="12" fill="#4a90e2" stroke="#ffffff" stroke-width="2"/>
    <text x="18" y="5" fill="#ffffff" font-size="11">= 进攻</text>

    <circle cx="80" cy="0" r="12" fill="#ff4444" stroke="#ffffff" stroke-width="2"/>
    <text x="98" y="5" fill="#ffffff" font-size="11">= 防守</text>

    <rect x="160" y="-8" width="40" height="16" fill="#ff4444" opacity="0.2" stroke="#ff4444" stroke-width="1"/>
    <text x="210" y="5" fill="#ffffff" font-size="11">= 覆盖区</text>
  </g>
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4444" opacity="0.6"/>
    </marker>
  </defs>
</svg>